<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-6">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-center text-3xl font-bold text-gray-900">Welcome</h1>

    <!-- Login Form -->
    <form id="formLogin" class="mt-6 space-y-6" autocomplete="off" novalidate>
      <div>
        <label for="loginUsername" class="block text-sm font-medium text-gray-700">Username</label>
        <input
          id="loginUsername"
          name="username"
          type="text"
          autocomplete="username"
          required
          minlength="3"
          maxlength="50"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
      </div>
      <div>
        <label for="loginPassword" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          minlength="8"
          maxlength="72"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
      </div>
      <div>
        <button
          id="btnLoginSubmit"
          type="submit"
          class="w-full flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          Sign In
        </button>
      </div>
    </form>

    <div class="mt-4 text-center">
      <button
        id="btnShowRegister"
        type="button"
        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        Register New Account
      </button>
    </div>

    <!-- Registration Form (hidden by default) -->
    <form id="formRegister" class="mt-6 space-y-6 hidden" autocomplete="off" novalidate>
      <div>
        <label for="registerUsername" class="block text-sm font-medium text-gray-700">Username</label>
        <input
          id="registerUsername"
          name="username"
          type="text"
          autocomplete="username"
          required
          minlength="3"
          maxlength="50"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
      </div>
      <div>
        <label for="registerPassword" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          id="registerPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          minlength="8"
          maxlength="72"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
      </div>
      <div>
        <button
          id="btnRegisterSubmit"
          type="submit"
          class="w-full flex justify-center rounded-md border border-transparent bg-green-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        >
          Register
        </button>
      </div>
    </form>
  </div>

  <script>
    (() => {
      const btnShowRegister = document.getElementById('btnShowRegister');
      const formRegister = document.getElementById('formRegister');
      const formLogin = document.getElementById('formLogin');

      btnShowRegister.addEventListener('click', () => {
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
        btnShowRegister.classList.add('hidden');
      });
    })();
  </script>
</body>
</html>
